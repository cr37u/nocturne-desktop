[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nocturne"
dynamic = ["version"]
description = "Local music player that downloads audio from YouTube links and plays everything offline."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Nocturne contributors" }]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: POSIX :: Linux",
    "Topic :: Multimedia :: Sound/Audio :: Players",
    "Environment :: X11 Applications :: Qt",
]
dependencies = [
    "PySide6-Essentials==6.12.0",
    "PySide6-Addons==6.12.0",
    "yt-dlp[default]==2026.10.26",
    "comtypes==1.5.0; sys_platform == 'win32'",
    "winrt-runtime==4.1.0; sys_platform == 'win32'",
    "winrt-Windows.ApplicationModel==4!10.0.28000.2957; sys_platform == 'win32'",
    "winrt-Windows.Data.Xml.Dom==4!10.0.28000.2957; sys_platform == 'win32'",
    "winrt-Windows.Foundation==4!10.0.28000.2957; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections==4!10.0.28000.2957; sys_platform == 'win32'",
    "winrt-Windows.Media==4!10.0.28000.2957; sys_platform == 'win32'",
    "winrt-Windows.Media.Playback==4!10.0.28000.2957; sys_platform == 'win32'",
    "winrt-Windows.Storage==4!10.0.28000.2957; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams==4!10.0.28000.2957; sys_platform == 'win32'",
    "winrt-Windows.UI.Notifications==4!10.0.28000.2957; sys_platform == 'win32'",
    "jeepney==0.9.0; sys_platform == 'linux'",
]

[project.optional-dependencies]
build = ["pyinstaller==6.22.3", "pyinstaller-hooks-contrib==2026.10"]

[project.gui-scripts]
nocturne = "nocturne.__main__:main"

[tool.setuptools]
packages = { find = { include = ["nocturne*"] } }

[tool.setuptools.dynamic]
version = { attr = "nocturne.__version__" }

[tool.setuptools.package-data]
nocturne = [
    "qml/Nocturne/*.qml",
    "qml/Nocturne/qmldir",
    "assets/fonts/*",
    "assets/icons/*",
    "i18n/*.qm",
]

[tool.ruff]
line-length = 120
target-version = "py312"
